# Include inside the existing homepage server block; retain its access rules.
location = /status/mirrors.json {
    alias /var/lib/keimirror-telemetry/public/mirrors.json;
    types { }
    default_type application/json;
    autoindex off;
    expires -1;
    etag off;
    if_modified_since off;
    limit_except GET {
        deny all;
    }
}
