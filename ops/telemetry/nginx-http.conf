# Include only in http {} via /etc/nginx/conf.d/*.conf.
# This SECOND http-level log leaves the existing custom access log unchanged.
# Use normalized $uri solely to select a fixed repository label; never log it.
map "$server_name:$uri" $keimirror_project {
    default "";
    ~^(?:mirror\.keiminem\.com|mirror2\.keiminem\.com):/(?<keimirror_repository>archlinux|gentoo|gentoo-portage|kali|kali-images|cachyos|artix|artix-iso|artix-weekly-iso|opnsense|endeavouros|fyralabs|manjaro|proxmox)(?:/|$) $keimirror_repository;
}

log_format keimirror_telemetry escape=json
    '{"project":"$keimirror_project","ts":$msec,"bytes":$body_bytes_sent,"request_bytes":$request_length,"status":$status}';

# Existing nginx logrotate policy covers /var/log/nginx/*.log and reopens logs.
access_log /var/log/nginx/keimirror-telemetry.log keimirror_telemetry buffer=64k flush=1s if=$keimirror_project;
