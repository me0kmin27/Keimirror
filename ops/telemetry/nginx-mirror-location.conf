# Include inside the existing mirror server block; retain its access rules.
location = /.well-known/keimirror-status.json {
    alias /var/lib/keimirror-telemetry/public/snapshot.json;
    types { }
    default_type application/json;
    autoindex off;
    expires -1;
    etag off;
    open_file_cache off;
    if_modified_since off;
    limit_except GET {
        deny all;
    }
}
